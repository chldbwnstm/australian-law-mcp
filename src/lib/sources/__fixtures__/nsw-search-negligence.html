		</h4>

		
			<div class="hidden-xs hidden-sm">
				<p><strong>Catchwords:</strong></p>
				<p>
					NEGLIGENCE - Architect - whether negligently advised that building could not be constructed in compliance with plans in DA with which property purchased by plaintiff - where advice only established to be incorrect after iterative development of plans in context of subsequent litigation and as a result of incorporation of apparently innovative design - architect did not depart from standards of practice of reasonably competent and prudent architects - no breach of duty of care. MISLEADING AND DECEPTIVE CONDUCT - Architect's advice said to be misleading - whether opinion that building could not be constructed in compliance with plans in DA - professional opinion recognisable as such not misleading by reason of proving incorrect so long as genuinely held and a basis for it exists - opinion genuinely held - opinion not without grounds - only established to be incorrect after iterative development of plans in context of subsequent litigation as a result of incorporation of apparently innovative design - not unreasonable that architect did not discern this at time opinion proffered - no misleading and deceptive conduct. BARRISTERS - Professional negligence - where barrister said to have breached duty of care by advising institution and subsequently not advising discontinuance of proceedings for specific performance with compensation in circumstances that purchaser had architect's advice that building could not be constructed in compliance with plans in DA with which property purchased and various conditions of contract limited purchaser's rights in that respect - where proceedings continued after judge on application to extend operation of caveat holds no serious question to be tried on basis of one condition - arguable case to contrary on that condition - where claim for specific performance with compensation very weak but proceedings included well arguable claims for misleading and deceptive conduct and for return of deposit - barrister did not in relevant respects depart from standard expected of a barrister of reasonable competence and prudence - no breach of duty of care - in any event, properly advised plaintiff would have continued proceedings to claim damages under Fair Trading Act - causation could not have been established. SOLICITORS - Professional negligence - whether breached duty of care by advising institution and subsequently not advising discontinuance of proceedings for specific performance and compensation - solicitor receives advice from barrister that claim is arguable - not glaringly wrong - solicitor entitled to rely on advice - no breach of duty of care. SOLICITORS - Professional negligence - solicitor for purchaser receives notice to complete from vendor - reasonably competent and prudent solicitor in such circumstances obliged to discuss courses of action and their advantages and disadvantages with client to enable client to make informed decision - solicitor fails to give advice in timely manner - breach of duty established - causation - properly advised plaintiff would have been presented with options to complete purchase and sue for damages, or refuse to complete and bring actions for misleading and deceptive conduct under Fair Trading Act, s 42 and for return of deposit under Conveyancing Act s 55(2A) - former option less legally risky, latter more commercially attractive to plaintiff - contemporaneous statements and surrounding circumstances evince that particular plaintiff, properly advised, would still have taken more commercial option - causation not established.
				</p>
