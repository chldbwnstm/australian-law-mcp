<h1 class="au-header-heading">Evidence of inappropriate conduct </h1>
<article class="node node--type-case_summary node--view-mode-full clearfix">
<div  class="layout__region layout__region--content">
          <div class="block block--entity-field-node-body block--layout-builder block--field-blocknodecase-summarybody">
    
        
          <div class="content">
        
            <div class="field field--name-body field--type-text-with-summary field--label-hidden field__item"><div><p><span lang="EN-AU">The employee was found to have struck their colleague between the legs, near and targeting the buttocks/genital area. The employee strongly denied the allegation and sought a review of the finding that their conduct had breached the Code of Conduct.</span></p><p><span lang="EN-AU">Our review considered whether, on the balance of probabilities, there was sufficient evidence to determine the employee’s conduct occurred, and if so, was in breach of the agency’s Conduct and Behaviour Policy and Sexual Harassment Policy.</span></p><p><span lang="EN-AU">We determined the evidence was compelling and confirmed the incident occurred as alleged. The colleague’s version of events was consistent and credible. While the incident was not directly witnessed, the investigator obtained accounts from staff who were in the area and who observed the colleague flinching in shocked reaction. These accounts were supported by contemporaneous text messages between the colleague and other staff members immediately after the incident, noting the colleague was ‘unsettled’ and ‘visibly shaken’.</span></p><p><span lang="EN-AU">On the evidence presented, it was established the applicant’s conduct was unwelcome and inappropriate and amounted to sexual harassment as defined by the agency’s own policy. As the applicant was unable to provide a plausible alternative explanation for what occurred, we recommended the agency confirm the decision. </span></p></div></div>
