name: Agent task
description: A bounded change with explicit acceptance criteria and risk areas
title: "[Task] "
body:
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      description: Select the environment where Australian Law MCP runs. If you use WSL on Windows, choose WSL.
      options:
        - macOS
        - Windows
        - Linux
        - WSL
        - Other (describe in the problem below)
    validations:
      required: true
  - type: dropdown
    id: aside-enabled
    attributes:
      label: Aside browser research
      description: >
        Is Aside browser research enabled for this MCP setup? In Claude Desktop,
        check "Finish blocked legal sources using the Aside browser" under
        Settings > Extensions > Australian Law. For other clients, check your
        Aside integration settings.
      options:
        - Enabled
        - Disabled
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
      description: Include a concrete before/after example and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes and relevant tests.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and files
      description: Suggest affected files and explain what is outside scope.
    validations:
      required: true
  - type: checkboxes
    id: risks
    attributes:
      label: Risk areas
      description: Select every area affected; these may require human implementation.
      options:
        - label: Authentication, credentials, or permissions
        - label: CI, automation policy, or deployment
        - label: Dependencies or package publishing
        - label: Public API, data integrity, or legal source interpretation
  - type: markdown
    attributes:
      value: >
        A maintainer can add agent-candidate for triage. After reviewing the
        bot's snapshot, a human with repository write access must add
        agent-approved. Editing the issue afterwards invalidates that approval.
