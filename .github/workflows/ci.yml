name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Retain the published runtime floor; use supported LTS for the daemon.
        node: ["20.19", "22", "24"]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts: nothing in this tree needs a postinstall, and a lockfile
      # install that can run arbitrary scripts is not something CI should offer.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # The offline suite reaches no network: every parser test runs against a
      # recorded fixture. The live suite is gated on LIVE=1 and is deliberately
      # NOT run here — it asserts on upstreams that are free to change, so it
      # would turn someone else's site outage into a red build.
      - run: npm test

      - run: npm run build

      - run: npm run build:automation

      - run: node build-automation/daemon.js --dry-run --offline --once

      - run: npm run verify:stdio

      # The tarball is an allowlist (`files` in package.json). Packing here is
      # what catches a build output that stopped being included.
      - run: npm pack --dry-run

  quality:
    name: CI quality gate
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and Node version
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
